name: Release Obsidian plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from manifest.json, without a v prefix
        required: true
        type: string
  push:
    tags:
      - '[0-9]*'

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Build and verify plugin
        run: |
          npm ci
          npm run release:prepare
      - name: Verify tag matches manifest
        run: test "$RELEASE_TAG" = "$(node -p "require('./manifest.json').version")"
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/${{ env.RELEASE_TAG }}/main.js
            dist/${{ env.RELEASE_TAG }}/styles.css
            dist/${{ env.RELEASE_TAG }}/manifest.json
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its assets unchanged."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --draft "dist/$RELEASE_TAG/main.js" "dist/$RELEASE_TAG/manifest.json" "dist/$RELEASE_TAG/styles.css"
          fi
